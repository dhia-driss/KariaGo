<div class="dashboard-container">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <img src="assets/logo1.png" alt="KariaGo Logo" class="logo-icon" />        <span class="logo-text">KariaGo Admin</span>
      </div>
    </div>

    <div class="sidebar-content">
      <ul class="menu">
        <li class="menu-item">
          <a routerLink="/admin/car-location">
            <i class="fas fa-map-marker-alt"></i>
            <span>Car's Location</span>
          </a>
        </li>
        <li class="menu-item">
          <a routerLink="/admin/cars">
            <i class="fas fa-car-side"></i>
            <span>Cars</span>
          
          </a>
        </li>
        <li class="menu-item">
          <a routerLink="/admin/users">
            <i class="fas fa-users"></i>
            <span>Users</span>
          </a>
        </li>
        <li class="menu-item">
          <a routerLink="/admin/bookings">
            <i class="fas fa-calendar-alt"></i>
            <span>Bookings</span>
          </a>
        </li>
        <li class="menu-item">
          <a routerLink="/admin/reclamations">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Reclamations</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <header class="content-header">
      <h1>Dashboard Overview</h1>
    </header>

    <ng-container *ngIf="isDefaultView; else dynamicContent">
      <div class="stats-container">
        <!-- Stats Cards Go Here -->
      </div>
    </ng-container>

    <ng-template #dynamicContent>
      <router-outlet></router-outlet>
    </ng-template>
  </main>
</div>
