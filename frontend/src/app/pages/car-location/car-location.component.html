<google-map
  height="600px"
  width="100%"
  [center]="center"
  [zoom]="zoom">

  <map-marker
    *ngFor="let m of markers"
    [position]="m.position"
    [label]="m.label"
    [options]="m.options"
    (mapClick)="selectCar(m, infoWindowRef)">
  </map-marker>

  <map-info-window #infoWindowRef="mapInfoWindow" [position]="selectedPosition">
    <div *ngIf="selectedCar">
      <strong>Matricule:</strong> {{ selectedCar.matricule }}<br>
      <strong>Marque:</strong> {{ selectedCar.marque }}<br>
      <strong>Client:</strong> {{ selectedCar.fullName || '—' }}<br>
      <strong>Début location:</strong> {{ selectedCar.date_hour_booking | date:'short' }}<br>
      <strong>Fin location:</strong> {{ selectedCar.date_hour_expire | date:'short' }}
    </div>
  </map-info-window>

</google-map>
